<section class="s-faq">
  <div class="wrap estreito">
    <h2>{{ .s.titulo }}</h2>
    {{ $grupo := .pagina.File.Dir | anchorize }}
    {{ range $i, $item := .s.itens }}
    <details{{ if eq $i 0 }} open{{ end }} name="faq-{{ $grupo }}">
      <summary>{{ $item.p }}</summary>
      <p>{{ $item.r }}</p>
    </details>
    {{ end }}
  </div>
</section>
